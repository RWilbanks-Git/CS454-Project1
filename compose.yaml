services:
  api:
    build: .
    environment:
      PORT: 3000
      SERVICE_NAME: cs454-project1
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:3000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  redis-data: